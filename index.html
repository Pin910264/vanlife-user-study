function renderHome(){
  app.innerHTML=`<section class="hero"><div class="hero-copy"><div class="eyebrow">Interaction Research Lab · Cornell University</div><h1>User Study<br>VanLife Chatbot</h1><p class="lede">Design a van interior in VanSpace while interacting with a chatbot. Browse the available furniture and components before and during the study.</p><div class="hero-actions"><a class="primarybtn" href="#Study" data-go="Study">View study overview</a><a class="secondarybtn" href="#Bedroom" data-go="Bedroom">Browse furniture</a></div><div class="home-summary"><div class="stat"><b>${COUNTS.Bedroom}</b><span>Bedroom items</span></div><div class="stat"><b>${COUNTS.Kitchen}</b><span>Kitchen items</span></div><div class="stat"><b>${COUNTS.Bathroom}</b><span>Bathroom items</span></div><div class="stat"><b>${COUNTS.Accessories}</b><span>Accessories</span></div></div></div><div class="hero-gallery"><figure><img id="studyExample" src="${STUDY_EXAMPLES[0]}" alt="Example VanSpace interior layout"></figure><div class="carousel-dots"><button class="carousel-dot active" data-slide="0" aria-label="Show example 1"></button><button class="carousel-dot" data-slide="1" aria-label="Show example 2"></button></div></div></section><div class="home-intro"><div><h2>Furniture library</h2><p>Select an area to view all available design assets.</p></div></div><section class="homecards">${['Kitchen','Bedroom','Bathroom','Accessories'].map(p=>`<article class="homecard" data-go="${p}"><div class="homecard-preview">${HOME_PREVIEWS[p].map(src=>`<span><img src="${src}" alt=""></span>`).join('')}</div><div class="homecard-body"><div class="homecard-top"><h3>${p}</h3><span class="homecard-arrow">→</span></div><p>${COUNTS[p]} available items · ${[...new Set(DATA[p].map(x=>x.category))].length} broad categories</p><div class="homecard-cats">${HOME_CATS[p]}</div></div></article>`).join('')}</section><div class="site-note">User Study — VanLife Chatbot · Interaction Research Lab, Cornell University</div>`;
  document.querySelectorAll('[data-go]').forEach(x=>x.onclick=(e)=>{e.preventDefault();go(x.dataset.go)});
  let slide=0;
  const image=document.getElementById('studyExample');
  const dots=[...document.querySelectorAll('.carousel-dot')];
  const showSlide=(n)=>{slide=n;image.style.opacity='.18';setTimeout(()=>{if(!document.body.contains(image))return;image.src=STUDY_EXAMPLES[slide];image.style.opacity='1';dots.forEach((d,i)=>d.classList.toggle('active',i===slide));},160)};
  dots.forEach(d=>d.onclick=()=>{showSlide(+d.dataset.slide);restartHeroTimer()});
  heroTimer=setInterval(()=>showSlide((slide+1)%STUDY_EXAMPLES.length),4500);

function renderStudy(){
  app.innerHTML=`<div class="study-simple"><section class="study-goal"><div class="eyebrow">Study Overview</div><h1>Goal</h1><p>Through a VanSpace interior-design task, we compare a <strong>role-adaptive chatbot</strong> with a <strong>single-role chatbot</strong> to understand <strong>how conversational support helps novice designers</strong> and <strong>when that support is most useful</strong>.</p></section><section class="flow-card"><h2>Study flow · about 60 minutes</h2><div class="flow-simple"><div class="flow-item"><div class="flow-time">10 <span>min</span></div><h3>Familiarization</h3><p>Explore the design assets, VanSpace, and chatbot.</p></div><div class="flow-item"><div class="flow-time">30 <span>min</span></div><h3>Design with chatbot</h3><p>Design the van interior in VanSpace while interacting with the chatbot.</p></div><div class="flow-item"><div class="flow-time">20 <span>min</span></div><h3>Questionnaire & interview</h3><p>Reflect on the design process and chatbot experience.</p></div></div></section><div class="study-footer"><span>Participation details, recording, privacy, and compensation information are provided in the consent form.</span><a class="consent-link" href="#Consent" data-go="Consent">Read consent form →</a></div></div>`;
  document.querySelectorAll('[data-go]').forEach(x=>x.onclick=(e)=>{e.preventDefault();go(x.dataset.go)});
}
function renderConsent(){
  app.innerHTML=`<div class="info-shell consent-document"><a class="consent-back" href="#Study" data-go="Study">← Back to Study Overview</a>
  <section class="info-hero consent-title"><div class="eyebrow">Cornell University Research Study</div><h1>Interactive Vanlife Design Study Consent Form</h1><p>We are asking you to participate in a research study on understanding how people interact with and personalize the space in a van to make it comfortable for vanlife. This study is led by <strong>Stacey Li</strong> in the Department of Information Science at Cornell Tech. You must be at least 18 years of age to participate.</p><div class="consent-meta"><span>Participation is voluntary</span><span>Cornell IRB Protocol #0146565</span></div></section>
  <section class="consent-section"><h2>What the study is about</h2><p>The purpose of this study is to investigate the ways people approach and set up the space in a van. We aim to explore the pros and cons of different chatbot support methods in preparation for vanlife.</p></section>
  <section class="consent-section"><h2>What we will ask you to do</h2><p>If you agree to be in this study, we will ask you to spend approximately 1 hour designing and prototyping a setup based on a given vanlife scenario. The approved consent form describes approximately 15 minutes to design a van, followed by a 10-minute exit interview.</p><p>Some aspects of how the digital assistant works will not be fully explained until after your participation. You will receive a complete explanation during a debriefing session immediately following the study.</p></section>
  <section class="consent-section"><h2>Risks and benefits</h2><p>We do not anticipate physical risks beyond those encountered in day-to-day life. This study involves incomplete disclosure: certain details about how the digital assistant operates will not be revealed until after you complete the study. You will be fully informed during debriefing and will have the opportunity to ask questions or withdraw your data at that time.</p></section>
  <section class="consent-section"><h2>Compensation</h2><p>You will receive a <strong>$15.00 Amazon gift card</strong> for participating in this study.</p></section>
  <section class="consent-section"><h2>Statement of Consent for Audio/Video Recording</h2><p>Video cameras will be present in the space where the study is conducted. The video is for research purposes only, and only the researchers will have access to it.</p><p>We ask that you grant us the right to record video and audio during the study. The footage helps researchers review and analyze data across participants and gain an in-depth understanding of the van-life prototyping process. You may not participate in this study if you are not willing to have the interview recorded.</p></section>
  <section class="consent-section"><h2>Statement of Consent to Present Recorded Media</h2><p>If you agree to be recorded, we also ask whether you grant us the right to further use the audio and video recordings for analysis purposes, including making, using, editing, and publishing recordings in whole or in part in current or future media forms. Display of your video will be for academic and presentation purposes only.</p><p><strong>This permission is optional.</strong> You may still participate in the study if you do not agree to have recorded media presented under these conditions.</p></section>
  <section class="consent-section"><h2>Privacy, confidentiality, and data security</h2><p>Your identifiable consent-form data will be kept separate from research materials. Consent forms and research materials will be stored on secure servers accessible only to research lab members directly associated with the study. Permissions are managed by Principal Investigator <strong>Wendy Ju</strong>.</p><p>Video and audio data will be kept for analysis on secured systems with access limited to people approved by the Principal Investigator who are part of the research lab. Survey data is stored securely by Qualtrics and Cornell. Data may exist on backups and server logs beyond the timeframe of this research project.</p><p>Please note that email communication is neither private nor secure; information sent through email could be read by a third party.</p></section>
  <section class="consent-section"><h2>Taking part is voluntary</h2><p>Taking part in this study is completely voluntary. You may skip questions you do not want to answer. Deciding not to take part, or skipping questions, will not affect your current or future relationship with Cornell University. If you decide to take part, you are free to withdraw at any time.</p></section>
  <section class="consent-section"><h2>If you have questions</h2><p>The researchers conducting this study are <strong>Prof. Wendy Ju, Stacey Li, and Albert Han</strong>. For questions about the study, contact Stacey Li at <a class="inline-link" href="mailto:sl3326@cornell.edu">sl3326@cornell.edu</a>.</p><p>For questions or concerns about your rights as a research subject, contact the Cornell Institutional Review Board (IRB) at <strong>607-255-5138</strong> or visit <span class="inline-link">www.irb.cornell.edu</span>. You may also report concerns anonymously through Ethicspoint at <span class="inline-link">www.hotline.cornell.edu</span> or call toll free at <strong>1-866-293-3077</strong>.</p></section>
  <section class="consent-section consent-statement"><h2>Statement of Consent</h2><p>I have read the above information and have received answers to any questions I asked. I consent to take part in the study.</p><p>Please enter your full name in the study consent interface to indicate your consent, then proceed with the study.</p></section>
  </div>`;
  document.querySelectorAll('[data-go]').forEach(x=>x.onclick=(e)=>{e.preventDefault();go(x.dataset.go)});
}

 const arr=DATA[state.page]; const cats=['All',...new Set(arr.map(x=>x.category))];
 const shown=arr.filter(x => (state.filter==='All'||x.category===state.filter) && (!state.q || (`${x.id} ${x.name} ${x.desc} ${x.category}`).toLowerCase().includes(state.q.toLowerCase())));
 app.innerHTML=`<div class="pagehead"><div><h2>${state.page} furniture</h2><p>${arr.length} items · ${cats.length-1} categories</p></div></div><div class="controls"><input class="search" id="search" value="${state.q.replaceAll('"','&quot;')}" placeholder="Search furniture…"><div class="filters">${cats.map(c=>`<button class="filter ${c===state.filter?'active':''}" data-filter="${c}">${c}</button>`).join('')}</div></div><section class="grid">${shown.length?shown.map((x,i)=>`<article class="card" data-index="${arr.indexOf(x)}"><div class="imgwrap">${(x.item_img||x.image)?`<img src="${x.item_img||x.image}" alt="${x.id} ${x.name}" loading="lazy">`:''}</div><div class="cardbody"><div class="item-meta"><div class="item-id">${x.id}</div><span class="pill">${x.category}</span></div><div class="name">${x.name}</div>${x.dims?`<div class="dims">${fmtDims(x.dims)}</div>`:''}${x.desc?`<div class="desc">${x.desc}</div>`:''}</div></article>`).join(''):`<div class="empty">No matching items.</div>`}</section>`;
 document.getElementById('search').oninput=e=>{const start=e.target.selectionStart,end=e.target.selectionEnd;state.q=e.target.value;renderPage();const input=document.getElementById('search');input.focus();input.setSelectionRange(start,end)};
 document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;renderPage()});
 document.querySelectorAll('.card').forEach(c=>c.onclick=()=>openItem(arr[+c.dataset.index]));
}
document.getElementById('tVan').onclick=()=>{modalView='van';showModalImg()};document.getElementById('tItem').onclick=()=>{modalView='item';showModalImg()}
const fmtDims=d=>`${d.width.toFixed(0)} W × ${d.height.toFixed(0)} H × ${d.depth.toFixed(0)} D <small>in</small>`;
let modalItem=null,modalView='van';
function showModalImg(){const x=modalItem;const src=(modalView==='van'&&x.van_img)?x.van_img:(x.item_img||x.image||'');document.getElementById('mimg').src=src;document.getElementById('tVan').classList.toggle('on',modalView==='van');document.getElementById('tItem').classList.toggle('on',modalView!=='van')}
function openItem(x){modalItem=x;modalView=x.van_img?'van':'item';document.getElementById('mtoggle').style.display=x.van_img?'':'none';showModalImg();document.getElementById('mid').textContent=x.id;document.getElementById('mname').textContent=x.name;document.getElementById('mcat').textContent=x.category;document.getElementById('mdesc').textContent=x.desc||'No additional description.';document.getElementById('mdims').innerHTML=x.dims?'Item: '+fmtDims(x.dims):'';document.getElementById('mvan').innerHTML=x.dims?'Van interior: 70 W × 128 L <small>in</small> (Mercedes Sprinter L2H1)':'';document.getElementById('morig').textContent='Source category: '+x.original_category;modal.classList.add('open')}
document.getElementById('tVan').onclick=()=>{modalView='van';showModalImg()};document.getElementById('tItem').onclick=()=>{modalView='item';showModalImg()}
function go(page){if(heroTimer){clearInterval(heroTimer);heroTimer=null;}state={page,filter:'All',q:''};if(location.hash!=='#'+page)history.replaceState(null,'','#'+page);document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.page===page));if(page==='Home')renderHome();else if(page==='Study')renderStudy();else if(page==='Consent')renderConsent();else renderPage();window.scrollTo({top:0,behavior:'instant'})}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>go(t.dataset.page));document.getElementById('close').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};document.addEventListener('keydown',e=>{if(e.key==='Escape')modal.classList.remove('open')});const initial=location.hash.slice(1);go(['Study','Consent','Bedroom','Kitchen','Bathroom','Accessories'].includes(initial)?initial:'Home');
</script></body></html>
